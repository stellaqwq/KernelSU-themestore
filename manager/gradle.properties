android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.enableAppCompileTimeRClass=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.vfs.watch=true
android.r8.maxWorkers=4
android.native.buildOutput=verbose


# versionCode = 30000 + git commit count. A depth-1 clone reports a single commit
# (30001) even though the checked-out tag is v3.3.1, whose upstream code is 32680.
# Used only while the repo is shallow; run `git fetch --unshallow` to restore the
# real count instead.
KSU_VERSION_CODE_FALLBACK=32680
